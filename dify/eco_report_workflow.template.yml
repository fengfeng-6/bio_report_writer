app:
  description: 使用固定合成数据验证云主机端到端生态修复报告生成链路
  icon: 🌱
  icon_background: '#E4F2E8'
  mode: workflow
  name: 生态修复报告生成 Agent（云端自检）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 生态报告核心服务访问令牌，部署时在 Dify 中设置
    id: 438741c0-c920-4bf4-a5d3-858522303b7f
    name: ECO_REPORT_SERVICE_TOKEN
    selector:
    - env
    - ECO_REPORT_SERVICE_TOKEN
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-source-build-ir-target
      source: start
      sourceHandle: source
      target: build-ir
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: end
      id: build-ir-source-end-target
      source: build-ir
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 云端仅验证实现链路，正式报告在超算生成
        selected: false
        title: 启动合成自检
        type: start
        variables: []
      height: 194
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: ''
          type: none
        desc: 调用云端轻量服务，以固定合成数据生成受规则约束的 Markdown 报告
        headers: |-
          X-Report-Service-Token:{{#env.ECO_REPORT_SERVICE_TOKEN#}}
        method: get
        params: |-
          project_type:coal
          fid:900001
          target_year:2025
          project_name:云端合成自检
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 120
          max_write_timeout: 10
        title: 生成合成生态报告
        type: http-request
        url: __ECO_REPORT_API_BASE_URL__/v1/report-markdown
        variables: []
      height: 175
      id: build-ir
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 返回合成 Markdown 报告，用于验证链路实现
        outputs:
        - value_selector:
          - build-ir
          - body
          variable: report_markdown
        selected: false
        title: 输出自检报告
        type: end
      height: 119
      id: end
      position:
        x: 680
        y: 282
      positionAbsolute:
        x: 680
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
