[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-report-agent"
version = "0.1.0"
description = "Deterministic core and Dify adapter for ecological restoration reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eco-report = "eco_report_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
